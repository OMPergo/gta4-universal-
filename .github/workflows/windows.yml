name: Windows x86-64 & ARM64 Build

on:
  push:
    branches: [main, "jules-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows MSVC / Clang Build
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile and Run Unit Tests
        run: |
          cl /std:c++20 /EHsc /W4 /I LibertyRecomp\diagnostics /I LibertyRecomp\gpu /I LibertyRecomp\network /I installer ^
            LibertyRecomp\diagnostics\hardware_capability.cpp ^
            LibertyRecomp\diagnostics\performance_tiers.cpp ^
            LibertyRecomp\gpu\gpu_compatibility.cpp ^
            LibertyRecomp\network\authoritative_session.cpp ^
            installer\media_id_validator.cpp ^
            tests\unit\test_hardware_capability.cpp ^
            /Fe:test_windows.exe
          .\test_windows.exe
