name: Windows x86-64 & ARM64 Build

on:
  push:
    branches: [main, "jules-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Windows x86-64 MSVC Build
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and Test via CMake
        shell: cmd
        run: |
          cmake -B build-x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-x64 --config Release
          ctest --test-dir build-x64 -C Release --output-on-failure

  build-windows-arm64:
    name: Windows ARM64 MSVC Cross-Build
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (ARM64 Cross)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Build Core Library for Windows ARM64
        shell: cmd
        run: |
          cmake -B build-arm64 -DCMAKE_BUILD_TYPE=Release -A ARM64
          cmake --build build-arm64 --config Release --target LibertyUniversalCore
