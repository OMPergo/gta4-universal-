name: GTA IV Universal iOS App Build

on:
  push:
    branches: ["integration/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios-device-app:
    name: Build unsigned iPhoneOS ARM64 app with AOT game runtime
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Universal shared project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          submodules: false

      - name: Initialize pinned Theft4 source and all build dependencies
        run: |
          git submodule update --init runtime/theft4
          test "$(git -C runtime/theft4 rev-parse HEAD)" = "88115fefad59cfcb62d17c0c9548a7a900c01a23"
          git -C runtime/theft4 submodule update --init --recursive --jobs 4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Xcode and install CMake
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install cmake

      - name: Apply pinned dependency patches
        working-directory: runtime/theft4
        run: python3 tools/setup_repo.py

      - name: Configure full iOS app and AOT runtime
        working-directory: runtime/theft4
        run: |
          cmake --preset ios-device-release \
            -DLIBERTY_RECOMP_IOS_CORE_ONLY=ON \
            -DLIBERTY_RECOMP_EMBEDDED_ASSETS=OFF \
            -DTHEFT4_PUBLIC_BUILD=ON \
            -DTHEFT4_LAB_BUILD=OFF \
            -DTHEFT4_BUNDLE_IDENTIFIER=com.ompergo.gta4universal \
            -DTHEFT4_DISPLAY_NAME="GTA IV Universal" \
            -DTHEFT4_BUILD_GAME_CODE=ON \
            -DTHEFT4_ENABLE_GAME_STARTUP=ON \
            -DREXGLUE_RUNTIME_ONLY=ON \
            -DREXGLUE_HEADLESS_KERNEL=ON

      - name: Compile actual iOS app and generated GTA IV AOT code
        working-directory: runtime/theft4
        run: cmake --build --preset theft4-device-release --parallel 3

      - name: Package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find runtime/theft4/out/build/ios-device-release -type d -name 'Theft4.app' -print -quit)"
          test -n "$APP_PATH"
          test -s "$APP_PATH/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -s "$APP_PATH/$EXECUTABLE"
          file "$APP_PATH/$EXECUTABLE"
          lipo -info "$APP_PATH/$EXECUTABLE"
          mkdir -p dist/ios/Payload
          cp -R "$APP_PATH" dist/ios/Payload/
          (cd dist/ios && /usr/bin/zip -qry "$RUNNER_TEMP/GTA-IV-Universal-ios-arm64-unsigned.ipa" Payload)
          shasum -a 256 "$RUNNER_TEMP/GTA-IV-Universal-ios-arm64-unsigned.ipa" | tee "$RUNNER_TEMP/ios-ipa-sha256.txt"
          du -h "$RUNNER_TEMP/GTA-IV-Universal-ios-arm64-unsigned.ipa"

      - name: Record build boundaries
        if: always()
        run: |
          {
            echo "## GTA IV Universal iOS build"
            echo "- Runtime source: Theft4 pinned at 88115fefad59cfcb62d17c0c9548a7a900c01a23"
            echo "- Generated GTA IV AOT game code: enabled"
            echo "- Headless HLE startup path: enabled"
            echo "- Bundle identity: com.ompergo.gta4universal"
            echo "- Signing: none; IPA is unsigned"
            echo "- Game files/TU8: not included; user supplies legally obtained files"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned iOS IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta4-universal-1.0-alpha.1-ios-arm64-unsigned-ipa
          path: |
            ${{ runner.temp }}/GTA-IV-Universal-ios-arm64-unsigned.ipa
            ${{ runner.temp }}/ios-ipa-sha256.txt
          if-no-files-found: error
          retention-days: 14
