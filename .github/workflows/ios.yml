name: Apple iOS & iPadOS Build

on:
  push:
    branches: [main, "jules-*", "friday/android-runtime-audit"]
    paths:
      - ".github/workflows/ios.yml"
      - "ios/**"
      - "CMakeLists.txt"
      - "LibertyRecomp/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "ios/**"
      - "CMakeLists.txt"
      - "LibertyRecomp/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build GTA IV Universal for iPhone and iPad
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select compatible Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Build iPhone Simulator app
        run: |
          xcodebuild \
            -project ios/GTAIVUniversal.xcodeproj \
            -scheme GTAIVUniversal \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build/ios-simulator-iphone \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build iPad Simulator app
        run: |
          xcodebuild \
            -project ios/GTAIVUniversal.xcodeproj \
            -scheme GTAIVUniversal \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build/ipados-simulator \
            TARGETED_DEVICE_FAMILY=2 \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build universal iPhone and iPad device app
        run: |
          xcodebuild \
            -project ios/GTAIVUniversal.xcodeproj \
            -scheme GTAIVUniversal \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/ios-device \
            TARGETED_DEVICE_FAMILY='1,2' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO build

      - name: Validate and package iOS outputs
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_APP="build/ios-device/Build/Products/Release-iphoneos/GTAIVUniversal.app"
          SIM_APP="build/ios-simulator-iphone/Build/Products/Release-iphonesimulator/GTAIVUniversal.app"
          test -d "$DEVICE_APP"
          test -d "$SIM_APP"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$DEVICE_APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$DEVICE_APP/Info.plist")
          DEVICE_ARCHS=$(xcrun lipo -archs "$DEVICE_APP/$EXECUTABLE")
          echo "Bundle identifier: $BUNDLE_ID"
          echo "Device architectures: $DEVICE_ARCHS"
          [[ " $DEVICE_ARCHS " == *" arm64 "* ]]

          mkdir -p build/ipa/Payload
          cp -R "$DEVICE_APP" build/ipa/Payload/
          (cd build/ipa && /usr/bin/zip -qry ../../GTA-IV-Universal-iOS-iPadOS-unsigned.ipa Payload)
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" GTA-IV-Universal-iOS-Simulator.app.zip

          mkdir -p build/ipa-check
          unzip -q GTA-IV-Universal-iOS-iPadOS-unsigned.ipa -d build/ipa-check
          test -f "build/ipa-check/Payload/GTAIVUniversal.app/$EXECUTABLE"
          CHECK_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "build/ipa-check/Payload/GTAIVUniversal.app/Info.plist")
          test "$CHECK_BUNDLE_ID" = "$BUNDLE_ID"

          cat > ios-build-manifest.txt <<EOF
          Product: GTA IV Universal
          Bundle ID: $BUNDLE_ID
          Target: iPhone and iPad
          Minimum iOS: 15.0
          Device architectures: $DEVICE_ARCHS
          Device package: unsigned IPA (requires Apple signing before installation)
          Simulator package: simulator-only app archive
          Gameplay runtime: not yet ported to iOS
          Multiplayer: shared protocol/core integration not yet validated on iOS
          EOF

          shasum -a 256 GTA-IV-Universal-iOS-iPadOS-unsigned.ipa GTA-IV-Universal-iOS-Simulator.app.zip > ios-build-sha256.txt
          {
            echo "## GTA IV Universal — iPhone and iPad build"
            echo ""
            echo "- Bundle ID: `$BUNDLE_ID`"
            echo "- Device architectures: `$DEVICE_ARCHS`"
            echo "- Device IPA: unsigned; signing is required before installation."
            echo "- Simulator app: separate simulator-only archive."
            echo "- This is still the launcher shell; native gameplay and multiplayer are not yet integrated on iOS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS and iPadOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gta4-universal-ios-ipados-build
          path: |
            GTA-IV-Universal-iOS-iPadOS-unsigned.ipa
            GTA-IV-Universal-iOS-Simulator.app.zip
            ios-build-manifest.txt
            ios-build-sha256.txt
          if-no-files-found: error
          retention-days: 30
