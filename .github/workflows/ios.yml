name: Apple iOS & iPadOS Build

on:
  push:
    branches: [main, "jules-*", "integration/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: iOS Simulator Build & Host Validation
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build & Run Native Host Tests
        run: |
          cmake -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --parallel
          ctest --test-dir build-host --output-on-failure

      - name: Configure and Build iOS Simulator Target
        run: |
          cmake -B build-ios-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-ios-sim --config Release --target LibertyUniversalCore

  build-ios-device:
    name: iOS ARM64 Device Core Build (Unsigned; Not an IPA)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Configure and Build iOS ARM64 Device Target
        run: |
          cmake -B build-ios-dev -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO"
          cmake --build build-ios-dev --config Release --target LibertyUniversalCore

      - name: Stage Explicit Core-Only Artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ios-core
          DEVICE_LIB="$(find build-ios-dev -type f -name 'libLibertyUniversalCore.a' -print -quit)"
          test -n "$DEVICE_LIB"
          cp "$DEVICE_LIB" dist/ios-core/libLibertyUniversalCore-iphoneos-arm64.a
          cat > dist/ios-core/BUILD-STATUS.txt <<'EOF'
          GTA IV Universal iOS build artifact
          Artifact type: static core library only
          Platform: iPhoneOS ARM64
          Signing: none
          Installable IPA: NO
          Complete Theft4/LibertyRecomp game runtime: NOT INCLUDED
          App bundle / UIKit launcher: NOT INCLUDED
          Game data: NOT INCLUDED
          This artifact is for engineering integration only and cannot be installed on an iPhone.
          EOF
          shasum -a 256 dist/ios-core/libLibertyUniversalCore-iphoneos-arm64.a > dist/ios-core/SHA256SUMS.txt

      - name: Upload Core-Only Engineering Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta4-universal-ios-core-unsigned
          path: dist/ios-core/
          if-no-files-found: error
          retention-days: 14
