name: Apple iOS & iPadOS Build

on:
  push:
    branches: [main, "jules-*", "friday/android-runtime-audit"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: iOS Simulator Build & Host Validation
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build & Run Native Host Tests
        run: |
          cmake -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Configure and Build iOS Simulator Target
        run: |
          cmake -B build-ios-sim -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build-ios-sim --config Release --target LibertyUniversalCore

  build-ios-device:
    name: iOS ARM64 Device Target Build (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Configure and Build iOS ARM64 Device Target
        run: |
          cmake -B build-ios-dev -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO"
          cmake --build build-ios-dev --config Release --target LibertyUniversalCore
