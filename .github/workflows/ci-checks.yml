name: CI Verification & Code Quality

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Source and Workflow Linting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CMake Configuration & Formatting
        run: |
          cmake -B build-lint -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-lint
          ctest --test-dir build-lint --output-on-failure
