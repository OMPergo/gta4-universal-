name: Android ARM64 Build & Validation

on:
  push:
    branches: [main, "jules-*", "friday/**"]
    tags: ["android-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android ARM64 Native & APK Assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore pinned XHYN R2 Android sources and assets
        run: |
          UPSTREAM="vendor/XHYN-IV-recomp/os/android/app/src/main"
          test -d "$UPSTREAM/java/com/libertyrecomp"
          mkdir -p os/android/app/src/main/java/com/libertyrecomp os/android/app/src/main/assets os/android/app/src/main/res
          # Add upstream files only when absent; preserve our existing customized foundation.
          rsync -a --ignore-existing "$UPSTREAM/java/com/libertyrecomp/" os/android/app/src/main/java/com/libertyrecomp/
          rsync -a --ignore-existing "$UPSTREAM/assets/" os/android/app/src/main/assets/
          rsync -a --ignore-existing "$UPSTREAM/res/" os/android/app/src/main/res/
          echo "XHYN Java sources: $(find os/android/app/src/main/java/com/libertyrecomp -name '*.java' | wc -l)"
          echo "Android assets: $(find os/android/app/src/main/assets -type f | wc -l)"
          test "$(find os/android/app/src/main/java/com/libertyrecomp -name '*.java' | wc -l)" -ge 60
          test "$(find os/android/app/src/main/assets -type f | wc -l)" -ge 60

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Packages and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 python3-pip rsync
          yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Prepare every pinned upstream dependency and apply reviewed patches
        run: |
          python3 vendor/XHYN-IV-recomp/tools/setup_repo.py
          python3 vendor/XHYN-IV-recomp/tools/setup_repo.py --check
          test -f vendor/XHYN-IV-recomp/tools/XenosRecomp/CMakeLists.txt
          test -f vendor/XHYN-IV-recomp/glue/rexglue-sdk-main/gta4-recomp/generated/sources.cmake

      - name: Build Android Vulkan driver proxy and hooks
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          bash vendor/XHYN-IV-recomp/os/android/scripts/build_driver_proxy.sh

      - name: Build and stage the real GTA IV ARM64 engine
        env:
          STRIP: "1"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          bash vendor/XHYN-IV-recomp/os/android/scripts/build_native.sh 2
          UPSTREAM_LIBS="vendor/XHYN-IV-recomp/os/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p os/android/app/src/main/jniLibs/arm64-v8a os/android/app/src/main/assets/Resources
          cp "$UPSTREAM_LIBS"/*.so os/android/app/src/main/jniLibs/arm64-v8a/
          cp -a vendor/XHYN-IV-recomp/os/android/app/src/main/assets/Resources/. os/android/app/src/main/assets/Resources/
          test -f os/android/app/src/main/jniLibs/arm64-v8a/libmain.so
          test -f os/android/app/src/main/jniLibs/arm64-v8a/libliberty_install.so
          test -f os/android/app/src/main/jniLibs/arm64-v8a/librexruntime.so
          test -f os/android/app/src/main/jniLibs/arm64-v8a/libSDL3.so
          test -f os/android/app/src/main/jniLibs/arm64-v8a/libvulkan.so

      - name: Configure and Build Host Test Suite
        run: |
          cmake -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Configure and Build Android ARM64 Shared Library
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          cmake -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android-arm64 --target LibertyUniversalCore

      - name: Stage Native Libraries into Android jniLibs
        run: |
          mkdir -p os/android/app/src/main/jniLibs/arm64-v8a
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          if [ -f "build-android-arm64/libLibertyUniversalCore.so" ]; then
            cp build-android-arm64/libLibertyUniversalCore.so os/android/app/src/main/jniLibs/arm64-v8a/
          elif [ -f "build-android-arm64/libLibertyUniversalCore.a" ]; then
            cp build-android-arm64/libLibertyUniversalCore.a os/android/app/src/main/jniLibs/arm64-v8a/
          fi
          find "${ANDROID_NDK_HOME}" -name "libc++_shared.so" | grep "aarch64" | head -n 1 | xargs -I {} cp {} os/android/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Execute Android Gradle Assembly
        working-directory: os/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Verify Android APK Output & ARM64 Native Libraries
        run: |
          APK_PATH="os/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          test -f "os/android/app/src/main/jniLibs/arm64-v8a/libLibertyUniversalCore.so"
          test -f "os/android/app/src/main/jniLibs/arm64-v8a/libmain.so"
          test -f "os/android/app/src/main/jniLibs/arm64-v8a/librexruntime.so"
          test -f "os/android/app/src/main/jniLibs/arm64-v8a/libSDL3.so"
          FILE_SIZE=$(wc -c < "$APK_PATH")
          echo "APK size: $FILE_SIZE bytes"
          test "$FILE_SIZE" -gt 100000
          test "$FILE_SIZE" -le 104857600
          for LIB in os/android/app/src/main/jniLibs/arm64-v8a/*.so; do
            readelf -h "$LIB" | grep -q "AArch64"
          done

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta4-universal-debug-apk
          path: os/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create versioned GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          APK_PATH="os/android/app/build/outputs/apk/debug/app-debug.apk"
          printf '## %s\n\n- Commit: %s\n- Android ABI: arm64-v8a\n- CI: successful\n- APK: attached below\n\nThis is an automated development build. Until a stable release-signing key is configured, APKs from different workflow runs may not install as in-place updates over one another.\n' "$TAG_NAME" "$GITHUB_SHA" > release-notes.md
          gh release create "$TAG_NAME" "$APK_PATH" --title "GTA IV Universal $TAG_NAME" --notes-file release-notes.md
