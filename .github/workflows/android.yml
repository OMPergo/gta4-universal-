name: Android ARM64 Build & Validation

on:
  push:
    branches: [main, "jules-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android ARM64 Native & Host Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Packages via sdkmanager
        run: |
          yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973'

      - name: Configure and Build Host Test Suite
        run: |
          cmake -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

      - name: Configure and Build Android ARM64 Native Library
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/27.0.12077973"
          cmake -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android-arm64 --target LibertyUniversalCore

      - name: Assemble Android APK
        run: |
          if [ -d "os/android" ] && [ -f "os/android/gradlew" ]; then
            cd os/android
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "::notice ::Standalone Android application project (os/android) is not staged in this branch; APK assembly skipped."
          fi

      - name: Upload Android APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: os/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
