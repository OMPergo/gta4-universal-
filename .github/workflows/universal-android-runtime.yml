name: Universal Android Runtime APK

on:
  push:
    branches: ["integration/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-arm64-runtime-apk:
    name: Pinned XHYN ARM64 native runtime and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Universal project
        uses: actions/checkout@v4
        with:
          ref: integration/theft4-ios-xhyn-multiplatform
          fetch-depth: 1
          submodules: false

      - name: Initialize pinned Android runtime source
        run: |
          git submodule update --init runtime/xhyn-android
          test "$(git -C runtime/xhyn-android rev-parse HEAD)" = "be597d42d12abb04a552fd87e3853028499ae835"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_VER=29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865"

      - name: Initialize all pinned native runtime dependencies
        working-directory: runtime/xhyn-android
        run: git submodule update --init --recursive --jobs 4

      - name: Configure Universal Android runtime bridge
        run: cmake -S . -B build-android-runtime -DUNIVERSAL_ENABLE_XHYN_ANDROID_RUNTIME=ON

      - name: Build native ARM64 runtime and package debug APK
        run: cmake --build build-android-runtime --target universal_android_arm64_apk --parallel 2

      - name: Verify APK contains native runtime libraries
        run: |
          APK=runtime/xhyn-android/os/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libmain\.so'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/librexruntime\.so'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libSDL3\.so'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libc\+\+_shared\.so'
          sha256sum "$APK" | tee apk-sha256.txt
          du -h "$APK"

      - name: Upload unsigned debug APK (user game data not included)
        uses: actions/upload-artifact@v4
        with:
          name: universal-xhyn-android-arm64-debug-apk
          path: |
            runtime/xhyn-android/os/android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
